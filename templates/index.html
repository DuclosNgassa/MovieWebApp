{% extends "base.html" %}

{% block title %}Home - MaxiCine{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4 mb-5">
            <h2 class="h4 mb-3 fw-bold text-center"><i class="fa-solid fa-user-plus text-warning me-2"></i>Add New User</h2>
            <form action="{{ url_for('add_user') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">User Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter user name" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 text-dark fw-semibold">
                    <i class="fa-solid fa-plus me-1"></i> Create User
                </button>
            </form>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <h3 class="h4 mb-3 fw-bold"><i class="fa-solid fa-users me-2 text-secondary"></i>Existing Users</h3>
        {% if users %}
            <div class="list-group shadow-sm">
                {% for user in users %}
                    <a href="{{ url_for('get_user_movies', user_id=user.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 px-4">
                        <span class="fw-medium fs-5 text-dark">
                            <i class="fa-solid fa-user-circle text-muted me-2"></i>{{ user.name }}
                        </span>
                        <span class="badge bg-secondary rounded-pill">
                            <i class="fa-solid fa-chevron-right"></i>
                        </span>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-light text-center text-muted border py-4">
                No users found. Create one above to get started!
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
